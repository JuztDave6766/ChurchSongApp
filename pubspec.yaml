name: church_song_app
description: "Canti Liturgici - prepara e celebra le tue funzioni liturgiche."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.5
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/licenses/

  fonts:
    - family: Cormorant
      fonts:
        - asset: assets/fonts/CormorantGaramond.ttf
          weight: 400
        - asset: assets/fonts/CormorantGaramond.ttf
          weight: 500
        - asset: assets/fonts/CormorantGaramond.ttf
          weight: 600
        - asset: assets/fonts/CormorantGaramond.ttf
          weight: 700
        - asset: assets/fonts/CormorantGaramond-Italic.ttf
          style: italic
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
          weight: 300
        - asset: assets/fonts/Manrope.ttf
          weight: 400
        - asset: assets/fonts/Manrope.ttf
          weight: 500
        - asset: assets/fonts/Manrope.ttf
          weight: 600
        - asset: assets/fonts/Manrope.ttf
          weight: 700
